<!doctype html>
<div style="font-size: 15px">
    <div style="margin: 0 0 16px; padding: 0">Hello,</div>

    <div style="margin: 0 0 16px; padding: 0">
        We've received a request to verify the account associated with
        <strong>{{toEmailAddress}}</strong>.
    </div>

    <div style="margin: 0 0 16px; padding: 0">To verify your email address, enter the verification code below:</div>

    <div style="margin: 32px 0; padding: 20px; text-align: center; background-color: #fafafa; border-radius: 8px">
        <div
            style="
                margin: 0;
                padding: 0;
                color: #06192d;
                font-size: 28px;
                line-height: 1.2;
                font-weight: bold;
                letter-spacing: 6px;
                text-align: center;
            "
        >
            {{verificationCode}}
        </div>
    </div>

    <div style="margin: 0 0 16px; padding: 0">
        If you didn't create an account or request this verification, you can safely ignore this email.
    </div>
</div>
